services:
  db:
    image: postgres:16
    container_name: pingpong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pingpong}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: pingpong-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-pingpong};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      MailSettings__Host: ${MAIL_HOST}
      MailSettings__Port: ${MAIL_PORT}
      MailSettings__UserName: ${MAIL_USERNAME}
      MailSettings__Password: ${MAIL_PASSWORD}
      MailSettings__FromName: ${MAIL_FROM_NAME:-PingPong}
    volumes:
      - storage:/app/Storage

volumes:
  pgdata:
  storage: