<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Document Template</title>
  <style>
    .Box{
        width: 430px;
        height: 450px;
        border-radius: 30px;
        border-color: #000000;
        color: red;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .Child-Box{
        width: 283px;
        height: 338px;
        

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 45px;
    }
    .Text-Box{
        width: 283px;
        height: 175px;

        display: flex;
        flex-direction: column;
        align-items: center;
        
        gap: 30px;
    }
    .logo{
        width: 163px;
        height: 68px;

        display: flex;
        flex-direction: column;
        align-items: center;
        
        gap: 15px;

    }
    .Content{
        width: 100%;
        height: 59px;

        display: flex;
        flex-direction: column;
        align-items: center;
      
  
        gap: 8px;
    }
    .Сontent > p:first-child {
        text-align: center;
    }
    .Сontent > p:second-child {
        text-align: center;
    }

    .Button{
        width: 158px;
        height: 45px;
        border-radius: 41px;
        border-color: #FFF4F425;

        background-color: #1274FF;
        color: #FFFFFF;
        


    }
    .Footer{
        width: 100%;
        height: 28px;

        display: flex;
        flex-direction: column;
        align-items: center;
        
        gap: 16px;
    }
    .Divider{
        width: 100px;
        height: 1px;
        color: #A9A9A9;
    }



  </style>
</head>
<body>
    <div class=" Box">
        <div class = "Child-Box">
            <div class = "Text-Box">
                <div class = "logo">
                    <p>Ping-Pong</p>
                    <p>Confirm your email</p>
                </div>

                <div class = "Content">
                    <p>Hello, {{UserName}}</p>
                    <p>Please confirm your email address to activate your account.</p>
                </div>
            </div>

            <button class = "Button">
              Confirm email
            </button>
               
            
            <div class = "Footer">
                <div class ="Divider">

                </div>

                <p>
                  © 2026 PingPong. All Rights Reserved
                </p>
            </div>

        </div>

    </div>
  
</body>
</html>
